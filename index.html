<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生活支出台账</title><style>*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#1f2329;line-height:1.55}
#app{display:flex;min-height:100vh}
.sidebar{width:212px;flex:none;background:#fff;border-right:1px solid #e5e6eb;position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:5px}
.sidebar .logo{font-size:16px;font-weight:800;padding:6px 12px 16px;border-bottom:1px solid #f0f1f3;margin-bottom:10px}
.sidebar .tab{display:flex;align-items:center;gap:10px;border:none;background:none;font-size:14px;font-weight:600;color:#4e5969;padding:11px 14px;border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;width:100%}
.sidebar .tab.on{background:#eef2ff;color:#165dff}
.sidebar .tab:hover:not(.on){background:#f7f8fa}
.sidebar .spacer{flex:1}
.sidebar .balcard{background:#f7f8fa;border-radius:10px;padding:12px 14px;font-size:12px;color:#8f959e}
.sidebar .balcard b{display:block;color:#165dff;font-size:20px;font-family:monospace;margin-top:4px}
.main{flex:1;min-width:0}
.page{display:none;padding:24px 30px 60px}
.page.on{display:block}
h2{font-size:16px;font-weight:800;margin:0 0 14px;display:flex;gap:8px;align-items:center}
h2 .n{font-size:12.5px;color:#8f959e;font-weight:500}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
@media(max-width:900px){.sum{grid-template-columns:repeat(2,1fr)}}
.sc{background:#fff;border:1px solid #e5e6eb;border-radius:14px;padding:20px 22px}
.sc .l{font-size:13px;color:#8f959e;margin-bottom:8px}
.sc .v{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums}
.v.inc{color:#00b42a}.v.out{color:#f53f3f}.v.bal{color:#165dff}.v.trc{color:#ff7d00}
.panel{background:#fff;border:1px solid #e5e6eb;border-radius:14px;padding:20px 22px;margin-bottom:20px}
.prow{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.pn{width:90px;font-size:13px;font-weight:600;flex:none}
.ptrack{flex:1;height:22px;background:#f2f3f5;border-radius:6px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#94bfff,#165dff);border-radius:6px}
.pvv{font-family:monospace;font-size:13px;font-weight:700;width:88px;text-align:right;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
.tblwrap{background:#fff;border:1px solid #e5e6eb;border-radius:14px;overflow:auto;margin-bottom:8px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:#fafbfc;color:#8f959e;font-weight:700;text-align:left;padding:11px 12px;border-bottom:1px solid #e5e6eb;white-space:nowrap;font-size:12px}
table.tbl td{padding:10px 12px;border-bottom:1px solid #f0f1f3;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover{background:#fafbff}
.idc{font-family:monospace;font-weight:800;color:#4e5969;font-size:12.5px;white-space:nowrap;background:#eef2ff;border-radius:6px;text-align:center;cursor:pointer;transition:.15s}
.idc:hover{background:#165dff;color:#fff}
.idc.copied{background:#00b42a;color:#fff}
.dt{font-family:monospace;color:#4e5969;white-space:nowrap}
.sm{color:#1f2329;font-weight:600;min-width:130px}
.mo{font-family:monospace;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mo.out{color:#f53f3f}.mo.in{color:#00b42a}
.whob{font-size:11.5px;font-weight:700;color:#4e5969;background:#f2f3f5;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;margin-right:4px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block;margin-right:4px}
.badge.tr{background:#fff3e0;color:#ff7d00}.badge.in{background:#e8fff0;color:#00b42a}
.cat{font-size:11px;color:#ff7d00;background:#fff7e8;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block;margin-right:4px}
.pv{white-space:nowrap}
img.th{width:30px;height:40px;object-fit:cover;border-radius:5px;border:1px solid #e5e6eb;cursor:zoom-in;margin-right:3px;vertical-align:middle;background:#fafafa}
.nod{color:#c9cdd4;font-size:12px}
.rmk-td{min-width:150px}
.rmk{width:100%;min-width:130px;font-size:12.5px;font-family:inherit;color:#1f2329;padding:6px 9px;border:1px solid #e5e6eb;border-radius:7px;background:#fffef5}
.rmk:focus{outline:none;border-color:#165dff;background:#fff}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:99;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;font-size:13px;padding:10px 20px;border-radius:24px;opacity:0;transition:.25s;z-index:120;pointer-events:none}
.toast.show{opacity:1}
.alert{border-radius:14px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;gap:14px;font-size:15px}
.alert.ok{background:#e8fff0;border:1px solid #aef0c4;color:#009a29}
.alert.warn{background:#fff2f0;border:1px solid #ffc9c2;color:#f53f3f}
.alert .ic{font-size:24px;font-weight:800}
.setrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:8px}
.setrow input{font-size:18px;font-family:monospace;padding:10px 14px;border:1.5px solid #e5e6eb;border-radius:10px;width:160px}
.setrow input:focus{outline:none;border-color:#165dff}
.setrow button{background:#165dff;color:#fff;border:none;font-weight:700;padding:11px 22px;border-radius:10px;cursor:pointer;font-size:14px}
.hint{color:#8f959e;font-size:12.5px;margin-top:10px}
#gate{position:fixed;inset:0;background:linear-gradient(135deg,#eef2ff,#f4f5f7);display:flex;align-items:center;justify-content:center;z-index:200}
.gatebox{background:#fff;border:1px solid #e5e6eb;border-radius:18px;padding:38px 40px;width:360px;max-width:90vw;box-shadow:0 20px 60px rgba(20,40,80,.12);text-align:center}
.gatebox .ic{font-size:40px;margin-bottom:12px}
.gatebox h1{font-size:19px;font-weight:800;margin-bottom:6px}
.gatebox p{color:#8f959e;font-size:13px;margin-bottom:20px}
.gatebox input{width:100%;font-size:16px;font-family:monospace;letter-spacing:2px;padding:13px 15px;border:1.5px solid #e5e6eb;border-radius:11px;text-align:center;margin-bottom:14px}
.gatebox input:focus{outline:none;border-color:#165dff}
.gatebox button{width:100%;background:#165dff;color:#fff;border:none;font-weight:800;font-size:15px;padding:13px;border-radius:11px;cursor:pointer}
.gatebox .err{color:#f53f3f;font-size:13px;margin-top:12px;min-height:18px}

function go(p,el){document.querySelectorAll('.page').forEach(function(x){x.classList.remove('on')});document.getElementById('pg-'+p).classList.add('on');document.querySelectorAll('.sidebar .tab').forEach(function(x){x.classList.remove('on')});el.classList.add('on');window.scrollTo(0,0);}
function zoom(s){document.getElementById('lbi').src=s;document.getElementById('lb').style.display='flex';}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1400);}
function copyId(el,code){function done(){el.classList.add('copied');var old=el.textContent;el.textContent='已复制';toast('已复制编号 '+code);setTimeout(function(){el.textContent=old;el.classList.remove('copied')},900);}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done,function(){done()});}else{var ta=document.createElement('textarea');ta.value=code;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);done();}}
function refreshAlert(){var el=document.getElementById('thr');if(!el)return;var t=parseFloat(el.value||'0');localStorage.setItem('exp_thr',t);var box=document.getElementById('alertbox');
 if(BAL<t){box.className='alert warn';box.innerHTML='<span class="ic">!</span><div><b>余额不足提醒!</b> 当前结余 &yen;'+BAL.toFixed(2)+',已低于预警线 &yen;'+t.toFixed(2)+',请及时补充资金。</div>';}
 else{box.className='alert ok';box.innerHTML='<span class="ic">&#10003;</span><div><b>余额充足。</b> 当前结余 &yen;'+BAL.toFixed(2)+',高于预警线 &yen;'+t.toFixed(2)+'。</div>';}}
function init(){var bc=document.querySelector('[data-bal]');if(bc)BAL=parseFloat(bc.dataset.bal);
 var s=localStorage.getItem('exp_thr');if(s&&document.getElementById('thr'))document.getElementById('thr').value=s;refreshAlert();
 document.querySelectorAll('.rmk').forEach(function(el){var v=localStorage.getItem('rmk_'+el.dataset.k);if(v)el.value=v;el.addEventListener('input',function(){localStorage.setItem('rmk_'+el.dataset.k,el.value);});});}
function b64ToBytes(s){var bin=atob(s);var a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
async function tryUnlock(pw){var e=window.__ENC__;
 var pk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(e.s),iterations:200000,hash:'SHA-256'},pk,{name:'AES-GCM',length:256},false,['decrypt']);
 var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(e.i)},key,b64ToBytes(e.c));
 return new TextDecoder().decode(pt);}
async function unlock(){var pw=document.getElementById('pw').value;
 try{var htmlc=await tryUnlock(pw);var app=document.getElementById('app');app.innerHTML=htmlc;app.style.display='';document.getElementById('gate').style.display='none';sessionStorage.setItem('exp_pw',pw);init();}
 catch(err){document.getElementById('pwerr').textContent='密码错误,请重试';document.getElementById('pw').value='';}}
window.addEventListener('DOMContentLoaded',function(){
 var pwin=document.getElementById('pw');
 pwin.addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
 var saved=sessionStorage.getItem('exp_pw');
 if(saved){tryUnlock(saved).then(function(h){var app=document.getElementById('app');app.innerHTML=h;app.style.display='';document.getElementById('gate').style.display='none';init();},function(){});}
 pwin.focus();});</script></body></html>
